name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax check
        run: |
          python -m py_compile tracer.py analyzer.py 2>/dev/null || python -m py_compile tracer.py analyze.py

      - name: Logic tests (offline)
        run: python tests/test_logic.py

      - name: Trace artifacts present
        run: |
          test -f traces/2026-09-16-spinal-analysis.md
          test -f traces/spinal_2026-09-16_225609.json
          test -f traces/spinal_2026-09-16_225647.json
